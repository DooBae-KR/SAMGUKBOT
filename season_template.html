<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시즌 결산</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
/* 추천·인사 페이지와 같은 초록 라이트 테마 */
:root{color-scheme:light;--bg:#f3f8f3;--raise:#fff;--raise2:#e8f3e9;--line:#d3e4d5;--text:#1a2b1f;--mute:#5a6f5e;--jade:#2e7d32;--gold:#b7791f;--verm:#c62828;--blue:#2f7aa3;--ash:#8a9b8d;--pri:#2e7d32;--pri2:#c8e6c9;--sans:'Noto Sans KR','Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans);font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 60px}
header{padding:20px 0 6px}
header .in{padding:18px 20px;border-radius:14px;background:linear-gradient(115deg,#173c30,#285240);color:#eef5ef}
header small{color:#d5e7dc;font-size:12.5px}
h1{margin:2px 0 4px;font-size:clamp(22px,4.5vw,30px);font-weight:800;letter-spacing:-.02em}
h2.sec{font:700 16px var(--sans);margin:26px 2px 10px}
.sub{color:var(--mute);font-size:12.5px;margin:0 2px 10px}
.card{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 1px 3px rgba(20,60,30,.1)}
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 6px}
@media(min-width:700px){.strip{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 1px 3px rgba(20,60,30,.1)}
.stat:first-child{background:var(--pri);color:#fff}.stat:first-child span{color:#d7efd8}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.2}.stat span{color:var(--mute);font-size:12.5px}
.pill{display:inline-block;background:var(--pri);color:#fff;padding:2px 11px;border-radius:10px;font-size:12px}
.chart svg{width:100%;height:auto;overflow:visible}
.lg{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-top:6px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.cols{grid-template-columns:1fr}}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.rank li:first-child{border-top:0}
.rank .no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--raise2);font-weight:700;font-size:13px;color:var(--mute)}
.rank li:nth-child(-n+3) .no{background:var(--pri);color:#fff}
.rank .nm{min-width:0}.rank .nm b{font-size:14.5px;word-break:break-all}.rank .nm small{color:var(--mute);margin-left:6px;font-size:12px}
.bar{height:8px;border-radius:5px;background:var(--raise2);margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}
.rank .v{font-weight:700}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.aw{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 1px 3px rgba(20,60,30,.1)}
.aw .em{font-size:22px}.aw .t{color:var(--gold);font-weight:700;font-size:13px}.aw .n{font-size:18px;font-weight:800;word-break:break-all}.aw .m{color:var(--mute);font-size:12.5px}
.types{display:flex;flex-wrap:wrap;gap:10px}
.ty{flex:1;min-width:120px;background:var(--raise2);border-radius:14px;padding:10px 12px}.ty b{display:block;font-size:22px;font-weight:800}.ty span{font-size:12.5px;color:var(--mute)}
.jobs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.jobs span{background:#fff;border:1.5px solid var(--pri2);border-radius:99px;padding:4px 12px;font-size:13px}.jobs b{color:var(--pri);margin-left:4px}
.bye{margin-top:26px;text-align:center;color:var(--mute);font-size:14px}
</style></head><body>
<header><div class="wrap" style="padding-bottom:0"><div class="in"><small id="alli"></small><h1 id="ttl"></h1><small id="per"></small></div></div></header>
<div class="wrap">
<div class="strip" id="tiles"></div>
<p class="sub" id="s1s"></p>
<h2 class="sec">주차별 누적 흐름</h2><p class="sub">각 주가 끝날 때까지 동맹 전체가 쌓은 총 무훈과 총 공헌입니다</p><div class="card chart"><div id="chart"></div><div class="lg"><span><i style="background:var(--gold)"></i>무훈</span><span><i style="background:var(--jade)"></i>공헌</span></div></div>
<div class="cols"><div><h2 class="sec">⚔️ 무훈 TOP 10</h2><div class="card"><ol class="rank" id="rw"></ol></div></div>
<div><h2 class="sec">🌾 공헌 TOP 10</h2><div class="card"><ol class="rank" id="rc"></ol></div></div></div>
<h2 class="sec">🏅 시즌 어워드</h2><div class="awards" id="aws"></div>
<h2 class="sec">활동 유형과 직업 구성</h2><div class="card"><div class="types" id="types"></div><div class="jobs" id="jobs"></div></div>
<p class="bye" id="bye"></p>
</div>
<script>
const S=__S__,$=s=>document.querySelector(s),fmt=n=>Math.round(n||0).toLocaleString("ko-KR");
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ymd=s=>String(s||"").replaceAll("-",".");
$("#alli").textContent=S.alli||"우리 동맹";$("#ttl").textContent="시즌 "+S.no+" 결산";$("#per").textContent=ymd(S.first)+" ~ "+ymd(S.last)+" · "+S.days+"일 · 동맹원 "+S.n+"명";
document.title=(S.alli||"동맹")+" 시즌 "+S.no+" 결산";
[["총 무훈",S.wm,""],["총 공헌",S.ct,""],["공성 참여",S.sg,"회"],["번영 증가",S.pg,""]].forEach(([l,v,u])=>{const d=el("div","stat"),b=el("b",null,fmt(v)+u);d.append(b,el("span",null,l));$("#tiles").append(d)});
$("#s1s").textContent="기록 "+S.snaps+"일"+(S.joined?" · 중간 합류 "+S.joined+"명":"")+(S.left?" · 떠난 동맹원 "+S.left+"명":"")+(S.left_incl?" (이탈자 "+S.left_incl+"명의 기록 포함)":"");
(function(){const W=S.weeks||[];if(!W.length){$("#chart").textContent="주차 기록이 없습니다";return}
 const w=640,h=280,L=10,R=10,T=22,B=30,mx=Math.max(1,...W.flatMap(x=>[x.wm,x.ct])),X=i=>W.length<2?w/2:L+i*(w-L-R)/(W.length-1),Y=v=>T+(h-T-B)*(1-v/mx);
 const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
 const mk=(t,a)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);return e};
 for(let g=0;g<=4;g++){const y=T+(h-T-B)*g/4;svg.append(mk("line",{x1:L,x2:w-R,y1:y,y2:y,stroke:"#d3e4d5","stroke-width":1}))}
 W.forEach((x,i)=>{const t=mk("text",{x:X(i),y:h-8,fill:"#5a6f5e","font-size":12,"text-anchor":"middle"});t.textContent=x.w;svg.append(t)});
 [["wm","#b7791f"],["ct","#2e7d32"]].forEach(([k,c])=>{const pts=W.map((x,i)=>[X(i),Y(x[k])]);
  svg.append(mk("path",{d:pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(""),fill:"none",stroke:c,"stroke-width":3,"stroke-linecap":"round","stroke-linejoin":"round"}));
  pts.forEach(q=>svg.append(mk("circle",{cx:q[0],cy:q[1],r:4.5,fill:c})))});
$("#chart").append(svg)})();
function rank(id,L,col){const o=$(id);if(!L.length){o.append(el("li",null,"기록이 없습니다"));return}const mx=Math.max(1,L[0].v);
 L.forEach((x,i)=>{const li=el("li"),mid=el("div","nm"),b=el("b",null,x.n);mid.append(b);if(x.j)mid.append(el("small",null,x.j));
  const bar=el("div","bar"),f=el("i");f.style.cssText="width:"+Math.round(x.v/mx*100)+"%;background:"+col;bar.append(f);mid.append(bar);li.append(el("span","no",i+1),mid,el("span","v",fmt(x.v)));o.append(li)})}
rank("#rw",S.top_wm||[],"var(--gold)");rank("#rc",S.top_ct||[],"var(--jade)");
const EM={"무훈왕":"⚔️","공헌왕":"🌾","전천후":"🌟","개근왕":"📅","번영 성장왕":"🏙️","연속 활동왕":"🔥"};
(S.awards||[]).forEach(a=>{const d=el("div","aw");d.append(el("div","em",EM[a.t]||"🏅"),el("div","t",a.t),el("div","n",a.n),el("div","m",(a.j?a.j+" · ":"")+fmt(a.v)+" "+a.u));$("#aws").append(d)});
if(!(S.awards||[]).length)$("#aws").append(el("div","card","어워드 대상이 없습니다"));
Object.entries(S.types||{}).forEach(([k,v])=>{const d=el("div","ty");d.append(el("b",null,v+"명"),el("span",null,k));$("#types").append(d)});
(S.jobs||[]).forEach(j=>{const s=el("span",null,j.j);s.append(Object.assign(el("b"),{textContent:j.n}));$("#jobs").append(s)});
$("#bye").textContent="총 "+fmt(S.wm)+"의 무훈과 "+fmt(S.ct)+"의 공헌 — 모두 "+S.n+"명이 만든 결과입니다. 수고하셨습니다!";
</script></body></html>

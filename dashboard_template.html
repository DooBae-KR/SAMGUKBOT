<script>
let D=__D__, CFG=__CFG__;
const med=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2};
const pctr=a=>{const s=[...a].sort((x,y)=>x-y);return v=>{let lo=0,eq=0;for(const x of s){if(x<v)lo++;else if(x===v)eq++}return (lo+eq/2)/s.length*100}};
const q=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor((s.length-1)*p)]};
const ALT_DAYS=2;
const f=n=>Math.round(n).toLocaleString('ko-KR'), P=(a,b)=>b?Math.round(a/b*100):0;
let rc,rm;
let TALK=null;
if(CFG.edit&&CFG.talkNames)TALK=new Set(CFG.talkNames);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
let TMSG='',TEDIT=null,TQ='';
function prep(){if(TALK)D.forEach(d=>d.t=TALK.has(d.n)?1:0);D.forEach((d,i)=>d.i=i);rc=pctr(D.map(d=>d.c));rm=pctr(D.map(d=>d.m))}
const ACC={'액티브':'--jade','저조':'--ash','경고':'--gold','쟁 미참여':'--verm','집계 중':'--blue'};
const PAL=['--jade','--gold','--blue','--verm','--ash','#b48ad6','#e08fb0','#9bd36c'];
const W={m:55,c:35,talk:10};
const TOK_P=140000,TIER={t10:.1,t30:.3,t50:.5};   // 총(누적) 무훈 순위: 상위10% 천하무쌍 · 상위30% 액티브 · 상위50% 쟁참여자 · 나머지(하위50%) 중 번영 14만 이상 토돼지
let CUT={c10:0,c30:0,c50:0,n10:0,n30:0,n50:0,basis:'총(누적) 무훈'};
const AC_ORDER=['쟁 미참여','경고','저조','액티브','집계 중'];
const cv=c=>c.startsWith('--')?`var(${c})`:c;
const tag=(label,c)=>`<span class="tag" style="--c:${cv(c)}">${label}</span>`;
const acTag2=s=>tag(s,'--gold');
const acTag=s=>s?tag(s,ACC[s]||'--ash'):'';
const lastM=d=>{const v=d.a&&d.a.days.filter(x=>!x.x);return v&&v.length?v[v.length-1].m:null};
function derive(){
  const need=CFG.act?CFG.act.need:30;
  D.forEach(d=>{
    d.jaegi=!d.reg;
    const talk=d.t?W.talk:0;
    if(CFG.act&&d.a&&d.a.b!=null){
      d.score=Math.round((d.a.b+talk)*10)/10;
      d.ac=d.a.warn>=2?'쟁 미참여':d.a.warn===1?'경고':d.score>=need?'액티브':'저조';
    }else{
      d.score=Math.round((rm(d.m)/100*W.m+rc(d.c)/100*W.c+talk)*10)/10;   // 일 이력이 없으면 주간 수치 백분위로 임시 산정
      d.ac='집계 중';
    }

let ACT_SCOPE='week';
function activityRanks(rows,index){
  const values=rows.map(row=>row.cmp?.[index]).filter(Number.isFinite);
  const counts=new Map();
  for(const value of values)counts.set(value,(counts.get(value)||0)+1);
  const ordered=[...counts].sort(([a],[b])=>b-a);
  const labels=new Map();
  let rank=1;
  for(const [value,count] of ordered){
    labels.set(value,values.length===1?'비교 대상 부족':
      ordered.length===1?`전원 동일 · ${values.length}명`:
      `${count>1?'공동 ':''}${rank}위 / ${values.length}명`);
    rank+=count;
  }
  return {size:values.length,labels};
}
function activityHistory(){
  const dates=CFG.act?.dates?.slice(-7)||[];
  if(!dates.length)return '';
  const headers=dates.map(date=>`<th scope="col">${esc(date)}</th>`).join('');
  const rows=D.filter(row=>row.a?.days?.length).map(row=>{
    const days=new Map(row.a.days.map(day=>[day.d,day]));
    return `<tr><th scope="row">${esc(row.n)}</th>${dates.map(date=>{
      const day=days.get(date);
      return `<td>${day?`${f(day.m)} / ${f(day.c)}${day.g>1?`<small class="activity-source">${day.g}일 평균</small>`:''}`:'—'}</td>`;
    }).join('')}</tr>`;
  }).join('');
  return `<details class="activity-history"><summary>일별 무훈·공헌 기록</summary><p class="lead">무훈 / 공헌 순서입니다. 날짜 사이 기록이 빠진 경우 일평균을 표시합니다.</p><div class="tw"><table><thead><tr><th scope="col">닉네임</th>${headers}</tr></thead><tbody>${rows}</tbody></table></div></details>`;
}
function tabAct(){
  const root=$('t3'),historyOpen=root.querySelector('.activity-history')?.open;
  const weekly=ACT_SCOPE==='week',offset=weekly?0:2;
  const merit=activityRanks(D,offset),contribution=activityRanks(D,offset+1);
  const date=CFG.comparison?.date||CFG.rosterDate;
  const period=weekly&&CFG.comparison?`${CFG.comparison.weekStart} ~ ${date}`:`${date} 기준`;
  const title=weekly?'주간':'총';
  const cell=(row,index,ranks)=>{
    const value=row.cmp?.[index];
    if(!Number.isFinite(value))return `<td class="n">—<span class="activity-source">집계 자료 부족</span></td>`;
    const source=weekly?(Number.isFinite(row.cmp[index+2])?'총 누적 차이':'주간 원본'):'총 누적 원본';
    return `<td class="n"><b>${f(value)}</b><span class="activity-rank">${ranks.labels.get(value)}</span><span class="activity-source">${source}</span></td>`;
  };
  const sortBy=merit.labels.size>1?offset:offset+1;
  const rows=[...D].sort((a,b)=>(b.cmp?.[sortBy]??-1)-(a.cmp?.[sortBy]??-1)||String(a.n).localeCompare(String(b.n),'ko'));
  root.innerHTML=`<div class="activity-heading"><h2>연맹 활동 기록</h2><p class="lead">${esc(period)} · 동일 기간의 실적과 연맹 내 순위</p></div>
    <div class="activity-period" role="group" aria-label="활동 집계 범위"><button type="button" class="btn" data-activity="week" aria-pressed="${weekly}">이번 주</button><button type="button" class="btn" data-activity="total" aria-pressed="${!weekly}">총 누적</button></div>
    <div class="activity-coverage"><span>무훈 비교 가능 <b>${merit.size}/${D.length}명</b></span><span>공헌 비교 가능 <b>${contribution.size}/${D.length}명</b></span></div>
    <div class="tw activity-table"><table><thead><tr><th scope="col">닉네임</th><th scope="col" class="n">${title} 무훈</th><th scope="col" class="n">${title} 공헌</th><th scope="col" class="n">주간 공성<span class="activity-source">위탁 포함</span></th></tr></thead><tbody>${rows.map(row=>
      `<tr><th scope="row">${esc(row.n)}</th>${cell(row,offset,merit)}${cell(row,offset+1,contribution)}<td class="n">${Number.isFinite(row.cmp?.[4])?f(row.cmp[4])+'회':'—'}</td></tr>`).join('')}</tbody></table></div>${activityHistory()}`;
  if(historyOpen&&root.querySelector('.activity-history'))root.querySelector('.activity-history').open=true;
  root.querySelectorAll('[data-activity]').forEach(button=>button.onclick=()=>{
    ACT_SCOPE=button.dataset.activity;tabAct();root.querySelector(`[data-activity="${ACT_SCOPE}"]`)?.focus({preventScroll:true});
  });
}

}

const renderMeta=()=>{document.getElementById('meta').textContent=`명단 ${CFG.rosterFile}, 기준일 ${CFG.rosterDate}. 톡방 목록 ${CFG.talkFile}, 업데이트 ${CFG.talkDate}. 캐릭터 ID는 표시하지 않습니다.`};
const TABN={0:'현황',1:'명단',2:'이슈',3:'활동 기록',4:'기준표',5:'전투 등급',6:'톡방 관리',7:'부계정'};
const NAVMAIN=[[0,'🏠','현황'],[2,'⚠️','이슈'],[1,'👥','명단'],[3,'📈','활동 기록'],[-1,'⋯','더보기']];
const MORE=[[5,'🎖️','전투 등급'],[7,'👤','부계정'],[4,'📋','기준표']].concat(CFG.edit?[[6,'💬','톡방 관리']]:[]);
document.getElementById('nav').innerHTML=NAVMAIN.map(([i,ic,n])=>`<button data-i="${i}"><span class="pl">${ic}</span>${n}</button>`).join('');
document.body.insertAdjacentHTML('beforeend','<div class="sheetbg" id="mbg"></div><div class="msheet" id="msh"><div class="gr"></div>'+MORE.map(([i,ic,n])=>`<button data-m="${i}"><span>${ic}</span>${n}</button>`).join('')+'</div>');
let CURT=0;
function moreOpen(on){$('mbg').classList.toggle('on',on);$('msh').classList.toggle('on',on)}
function show(i){CURT=i;document.querySelectorAll('nav button,.tab').forEach(e=>e.classList.remove('on'));const main=NAVMAIN.some(x=>x[0]===i)?i:-1;document.querySelector(`nav button[data-i="${main}"]`).classList.add('on');document.getElementById('t'+i).classList.add('on');tip.classList.remove('on');moreOpen(false);window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===-1)moreOpen(!$('msh').classList.contains('on'));else show(i)});
$('mbg').onclick=()=>moreOpen(false);document.querySelectorAll('#msh button').forEach(b=>b.onclick=()=>show(+b.dataset.m));
prep();renderMeta();build();show(0);
// ---------- 실시간 데이터 / 업데이트 ----------
function refresh(){const i=CURT;const y=scrollY;prep();renderMeta();build();show(i);scrollTo(0,y)}
const nz=v=>{if(typeof v==='number')return v;const n=Number(String(v).replace(/[,\s]/g,''));return isNaN(n)?0:n};
async function sheetRows(file){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
function parseRoster(rows){
  const hi=rows.findIndex(r=>r.map(String).map(x=>x.trim()).includes('멤버'));
  if(hi<0)throw new Error("'멤버' 열이 있는 머리글 행을 찾지 못했습니다.");
  const H=rows[hi].map(x=>String(x).trim()),ix=n=>H.indexOf(n);
  const need=['멤버','직업','조별','직위','번영','주간 무훈','주간 공헌','주 공성 횟수','주둔지'];
  const miss=need.filter(n=>ix(n)<0);if(miss.length)throw new Error('빠진 열: '+miss.join(', '));
  const out=[];
  for(const r of rows.slice(hi+1)){
    const n=String(r[ix('멤버')]).trim();if(!n)continue;
    const m=String(r[ix('주둔지')]).match(/^\s*([^(]*)\(\s*(\d+)\s*,\s*(\d+)\s*\)/);
    out.push({n,j:String(r[ix('직업')]).trim(),g:String(r[ix('조별')]).trim(),r:String(r[ix('직위')]).trim(),p:nz(r[ix('번영')]),m:nz(r[ix('주간 무훈')]),c:nz(r[ix('주간 공헌')]),s:nz(r[ix('주 공성 횟수')]),reg:m?m[1].trim():'',x:m?+m[2]:0,y:m?+m[3]:0,t:0});
  }
  if(!out.length)throw new Error('명단 행이 없습니다.');
  const dup=out.map(d=>d.n).filter((n,i,a)=>a.indexOf(n)!==i);if(dup.length)throw new Error('닉네임이 겹칩니다: '+[...new Set(dup)].join(', '));
  return out;
}
const todayKST=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
let PENDING=null;
function msg(t,c){const m=$('amsg');m.textContent=t;m.className=c||''}
function bindTalk(db){
  $('atk').onclick=async()=>{
    const names=[...new Set($('tk').value.split(/[\n\t,]+/).map(x=>x.trim()).filter(x=>x&&x!=='멤버'&&x!=='닉네임'))];
    const tm=$('tmsg');
    if(!names.length){tm.textContent='붙여넣은 닉네임이 없습니다.';return}
    const have=new Set(D.map(d=>d.n)),miss=names.filter(n=>!have.has(n));
    try{await db.doc('roster/talk').set({names,date:todayKST(),updatedAt:Date.now()});$('tk').value='';
      tm.textContent=`톡방 ${names.length}명 적용`+(miss.length?`. 명단에 없는 이름 ${miss.length}명: ${miss.slice(0,8).join(', ')}${miss.length>8?' 외':''}`:'.')}
    catch(e){tm.textContent='저장하지 못했습니다: '+(e.code||e.message)}
  };
}
function bindAdmin(db){bindTalk(db);
  const ref=db.doc('roster/current'),fr=$('fr'),pv=$('aprev'),ap=$('aapply');
  fr.onchange=()=>{pv.disabled=!fr.files.length;ap.disabled=true;PENDING=null;msg('')};
  pv.onclick=async()=>{
    try{
      const rows=parseRoster(await sheetRows(fr.files[0]));      const old=new Map(D.map(d=>[d.n,d]));
      rows.forEach(d=>{d.t=TALK?(TALK.has(d.n)?1:0):(old.get(d.n)?old.get(d.n).t:0)});
      const cfg={...CFG,rosterFile:fr.files[0].name,rosterDate:todayKST()};
      const gone=D.filter(d=>!rows.some(x=>x.n===d.n)).length,fresh=rows.filter(d=>!old.has(d.n)).length;
      PENDING={rows,cfg};ap.disabled=false;
      msg(`${rows.length}명 확인. 신규 ${fresh}명, 빠진 사람 ${gone}명, 톡방 ${rows.filter(d=>d.t).length}명. 맞으면 [적용]을 누르세요.`);
    }catch(e){PENDING=null;ap.disabled=true;msg(e.message,'err')}
  };
  ap.onclick=async()=>{
    if(!PENDING)return;ap.disabled=true;
    try{await ref.set({rows:PENDING.rows,cfg:PENDING.cfg,updatedAt:Date.now()});msg('적용했습니다. 열려 있는 모든 화면이 곧바로 바뀝니다.','ok');PENDING=null;fr.value='';pv.disabled=true}
    catch(e){msg('저장하지 못했습니다: '+(e.code||e.message),'err');ap.disabled=false}
  };
}
async function initLive(){
  let db=null,user=null;
  try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
  if(!db)return;
  db.doc('roster/current').onSnapshot(snap=>{
    $('live').classList.add('on');$('live').lastChild.textContent='실시간 연결됨';
    if(!snap.exists)return;const v=snap.data();
    if(v&&Array.isArray(v.rows)&&v.rows.length&&v.cfg){D=v.rows.map(r=>({...r}));CFG=v.cfg;refresh()}
  },()=>{});
  db.doc('roster/talk').onSnapshot(snap=>{
    if(!snap.exists)return;const v=snap.data();
    if(v&&Array.isArray(v.names)){TALK=new Set(v.names);CFG={...CFG,talkFile:'스프레드시트 톡방참여자 탭',talkDate:v.date||CFG.talkDate};refresh()}
  },()=>{});
  let can=false;try{can=user?await user.canEdit():false}catch(e){}
  if(can){$('adm').hidden=false;bindAdmin(db)}
}

// ---------- 톡방 관리 탭 ----------
async function talkApi(body){
  const r=await fetch('/api/talk?t='+encodeURIComponent(CFG.tok),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('오류 '+r.status));return j}
async function talkDo(body,ok){
  try{const j=await talkApi(body);TALK=new Set(j.names);CFG={...CFG,talkFile:'대시보드 톡방 관리',talkDate:j.date};TEDIT=null;TMSG=ok(j);refresh()}
  catch(e){TMSG='❌ '+e.message;tabTalk()}}
function tabTalk(){
  const have=new Set(D.map(d=>d.n)),all=[...(TALK||[])].sort((a,b)=>a.localeCompare(b,'ko')),ghost=all.filter(n=>!have.has(n));
  const list=all.filter(n=>!TQ||n.includes(TQ));
  $('t6').innerHTML=`<section class="blk"><h2>톡방 참여자 관리</h2>
  <p class="lead">여기서 고친 목록이 곧바로 현황·명부·분석의 톡방 참여 표시에 반영됩니다. 현재 ${all.length}명이고, 명단에 없는 이름은 ${ghost.length}명입니다. 한 번 이 탭에서 저장하면 구글 시트 톡방참여자 탭 대신 여기 목록을 기준으로 합니다.</p>
  <div class="filters"><textarea id="tadd" rows="3" placeholder="추가할 닉네임을 줄바꿈이나 쉼표로 구분해 붙여넣으세요" style="flex:1;min-width:240px;font:14px var(--sans);padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:var(--raise);color:var(--text)"></textarea>
   <button class="btn" id="tadd_b" style="background:var(--gold);color:#17201e;border-color:var(--gold);font-weight:700">추가</button></div>
  <div class="filters"><input id="tq" placeholder="목록에서 검색" size="16" value="${esc(TQ)}"><button class="btn" id="tclean"${ghost.length?'':' disabled'}>명단에 없는 이름 ${ghost.length}명 정리</button>
   <button class="btn" id="tclear"${all.length?'':' disabled'}>전체 비우기</button><span class="lead" style="margin:0" id="tm">${esc(TMSG)}</span></div>
  <div class="tw"><table><thead><tr><th style="cursor:default">닉네임</th><th style="cursor:default">명단</th><th style="cursor:default;width:150px">관리</th></tr></thead><tbody>
  ${list.map(n=>`<tr data-n="${esc(n)}"><td>${TEDIT===n?`<input class="ren" value="${esc(n)}" maxlength="40" size="18">`:esc(n)}</td>
   <td>${have.has(n)?'<span style="color:var(--jade)">명단 있음</span>':'<span style="color:var(--verm)">명단에 없음</span>'}</td>
   <td>${TEDIT===n?'<button class="btn rsave">저장</button> <button class="btn rcancel">취소</button>':'<button class="btn redit">수정</button> <button class="btn rdel">삭제</button>'}</td></tr>`).join('')||'<tr><td colspan="3" style="color:var(--mute)">표시할 이름이 없습니다.</td></tr>'}
  </tbody></table></div></section>`;
  $('tq').oninput=e=>{TQ=e.target.value;const pos=e.target.selectionStart;tabTalk();const q=$('tq');q.focus();q.setSelectionRange(pos,pos)};
  $('tadd_b').onclick=()=>{const names=$('tadd').value.split(/[\n\t,]+/).map(x=>x.trim()).filter(Boolean);if(!names.length){TMSG='추가할 닉네임을 입력해 주세요.';return tabTalk()}
    talkDo({op:'add',names},j=>`✅ 추가했습니다. 현재 ${j.names.length}명`)};
  $('tclean').onclick=()=>{if(ghost.length&&confirm(`명단에 없는 ${ghost.length}명을 톡방 목록에서 지울까요?`))talkDo({op:'remove',names:ghost},j=>`✅ ${ghost.length}명을 정리했습니다. 현재 ${j.names.length}명`)};
  $('tclear').onclick=()=>{if(confirm('톡방 참여자 목록을 전부 비울까요?'))talkDo({op:'set',names:[]},()=>'✅ 목록을 비웠습니다.')};
  document.querySelectorAll('#t6 tr[data-n]').forEach(tr=>{const n=tr.dataset.n;
    const b=c=>tr.querySelector(c);
    if(b('.redit'))b('.redit').onclick=()=>{TEDIT=n;tabTalk();const i=document.querySelector('#t6 .ren');if(i){i.focus();i.select()}};
    if(b('.rdel'))b('.rdel').onclick=()=>talkDo({op:'remove',names:[n]},j=>`✅ '${n}'을(를) 삭제했습니다. 현재 ${j.names.length}명`);
    if(b('.rcancel'))b('.rcancel').onclick=()=>{TEDIT=null;tabTalk()};
    if(b('.rsave')){const go=()=>talkDo({op:'rename',from:n,to:b('.ren').value},()=>`✅ '${n}'을(를) '${b('.ren')?b('.ren').value.trim():''}'(으)로 바꿨습니다.`);b('.rsave').onclick=go;b('.ren').onkeydown=e=>{if(e.key==='Enter')go();if(e.key==='Escape'){TEDIT=null;tabTalk()}}}
  });
}
initLive();
</script>
